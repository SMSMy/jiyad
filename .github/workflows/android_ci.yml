name: Android CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "jiyad/*" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Divergence & Architecture Checker
        run: |
          git remote add upstream https://github.com/JunkFood02/Seal.git || true
          git fetch upstream main
          python3 tools/check-divergence

      - name: Run Unit Tests
        run: ./gradlew testGenericDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleGenericRelease
