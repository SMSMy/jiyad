name: Build Release APK

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    env:
      # Exposed at job level because the `secrets` context is not available
      # inside a step-level `if` condition (using it there makes the whole
      # workflow file invalid and the run fails at startup).
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Show Android SDK location
      run: echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"

    - uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Divergence & Architecture Checker
      run: |
        git remote add upstream https://github.com/JunkFood02/Seal.git || true
        git fetch upstream main
        python3 tools/check-divergence

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Sign app APK
      if: env.SIGNING_KEY != ''
      id: sign_app
      uses: ilharp/sign-android-release@nightly
      with:
        releaseDir: app/build/outputs/apk/generic/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apks
        path: app/build/outputs/apk/generic/release/*.apk
        if-no-files-found: error
        retention-days: 20
